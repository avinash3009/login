<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Event Registration</h1>

    <h2>Login</h2>
    <form id="loginForm">
    <label>Username:</label>
    <input type="text" id="username" required>
    <label>Password:</label>
    <input type="password" id="password" required>
         <button type="submit">Check Login</button>
        <p id="loginMessage"></p>
    </form>

    <div id="registration" style="display: none;">
    <h2>Student Details</h2>
    <form id="registrationForm">
    <label>Student name:</label>
    <input type="text" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Age (below 30):</label>
    <input type="number" min="1" max="29" required>

    <label>Phone (10 digits):</label>
    <input type="tel" pattern="[0-9]{10}" maxlength="10" required>

    <label>Date of birth:</label>
     <input type="date" required>

        <label>Gender:</label>
        <select required>
        <option value="">Choose gender</option>
        <option>Female</option>
        <option>Male</option>
        <option>Other</option>
        </select>

        <label>Department:</label>
        <select required>
        <option value="">Choose department</option>
        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Commerce</option>
        <option>Arts</option>
        <option>Science</option>
     </select>

    <label>Event:</label>
    <select required>
    <option value="">Choose event</option>
    <option>Coding Competition</option>
    <option>Cultural Program</option>
    <option>Sports</option>
    <option>Quiz</option>
    </select>

    <label>Address:</label>
    <textarea required></textarea>

    <button type="submit">Submit</button>
    <p id="registrationMessage"></p>
    </form>
    </div>

 <script src="script.js"></script>
</body>
</html>
